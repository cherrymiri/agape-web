<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05040a">
<title>AGAPE</title>
<meta name="description" content="무조건적인 사랑">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="stage" aria-label="비눗방울 막대와 빛의 정원"></canvas>
<button id="wandBtn" class="sr">비눗방울 막대 들기 또는 내려놓기</button>

<header id="title"><h1>AGAPE</h1><p>무조건적인 사랑</p><p id="lead">사랑을 불어 보내보세요.</p></header>
<p id="note"><span class="main">지금, 꽃들에게 사랑을 보내고 있어요.</span><span class="sub">어떤 비눗방울은 흔적을 남기고, 어떤 비눗방울은 멀리 사라집니다.</span></p>
<p id="hint" role="status"></p>

<div id="actions">
  <button id="micBtn" hidden>마이크 켜기</button>
  <button id="holdBtn" hidden>길게 눌러 불기</button>
</div>

<button id="setBtn" aria-label="입력 설정" aria-expanded="false" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z M6 11a6 6 0 0 0 12 0 M12 17v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><i id="micLvl" aria-hidden="true"></i></button>
<section id="settings" hidden>
  <label for="sens">마이크 감도</label>
  <input id="sens" type="range" min="0" max="100" value="50">
  <div id="meter" aria-hidden="true"><i id="level"></i><b id="gate"></b></div>
  <p id="micState"></p>
  <button id="noMic">마이크 없이 하기</button>
</section>

<section id="ending" hidden>
  <p class="ko">사랑을 주는 데 이유가 필요한가요?</p>
  <p class="en">Do I need a reason to give love?</p>
  <button id="againBtn">다시 하기</button>
</section>
<script type="module" src="/src/main.js"></script>
</body>
</html>
