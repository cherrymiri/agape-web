<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"></head><body><title>AGAPE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>:root{color-scheme:dark;--void:#05040a;--milk:#eef1fb;--dim:#b8bfe4;--line:#dfe4ff33;--plate:#14162866;
--display:"Gowun Batang","Apple SD Gothic Neo","Noto Serif KR",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--void);color:var(--milk);font-family:var(--display);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.sr{position:fixed;left:-999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0}
.sr:focus-visible{left:16px;top:16px;width:auto;height:auto;opacity:1;z-index:9}
#title{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 11vh);text-align:center;pointer-events:none;transition:opacity 1.4s ease,transform 1.4s ease}
#title h1{margin:0;font-weight:400;font-size:clamp(40px,6.4vw,76px);letter-spacing:.34em;text-indent:.34em}
#title p{margin:12px 0 0;color:var(--dim);font-size:clamp(14px,1.5vw,18px);letter-spacing:.24em;text-indent:.24em}
#title.small{opacity:0;transform:translateY(-10px)}
#hint{position:fixed;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);margin:0;text-align:center;color:var(--dim);font-size:15px;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .9s ease}
#hint.on{opacity:1}
#lead{margin-top:clamp(20px,4vh,36px)!important;color:#e4e8fa!important;font-size:clamp(17px,2vw,24px)!important;letter-spacing:.1em!important;text-indent:.1em!important;filter:drop-shadow(0 0 10px #b8c0ff40)}
#note{position:fixed;left:24px;right:24px;top:calc(env(safe-area-inset-top,0px) + 6vh);margin:0;text-align:center;color:#d9def5;font-size:clamp(14px,1.6vw,18px);letter-spacing:.05em;word-break:keep-all;line-height:1.6;pointer-events:none;opacity:0;transition:opacity 1.8s ease;filter:drop-shadow(0 0 9px #b8c0ff33)}
#note.on{opacity:1}
#actions{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-inline:72px;pointer-events:none}
button{font:inherit;color:var(--milk);background:var(--plate);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:10px 20px;min-height:42px;font-size:15px;letter-spacing:.05em;cursor:pointer;pointer-events:auto;touch-action:manipulation;transition:background .3s,border-color .3s}
button:hover{border-color:#ffffff70}
button:focus-visible{outline:2px solid var(--milk);outline-offset:3px}
#holdBtn{touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#holdBtn.on{background:#efe8ff2e;border-color:var(--milk)}
#setBtn{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:42px;height:42px;padding:0;display:grid;place-items:center}
#setBtn[hidden],#settings[hidden],#ending[hidden]{display:none}
#settings{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 82px);width:min(280px,calc(100vw - 40px));background:#120f1ce6;border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;font-size:14px}
#settings input{width:100%;accent-color:#d9ccff;margin:0}
#settings p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
#meter{position:relative;height:8px;border-radius:4px;background:#ffffff14;overflow:hidden}
#level{position:absolute;left:0;top:0;bottom:0;width:0;background:#d9ccff}
#gate{position:absolute;top:0;bottom:0;width:2px;background:#fff}
#ending{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 7.5vh);text-align:center;padding-inline:24px;opacity:0;transition:opacity 1.5s ease;pointer-events:none}
#ending.on{opacity:1}
#ending::before{content:"";position:absolute;left:50%;top:-34%;width:min(760px,100%);height:150%;transform:translateX(-50%);background:radial-gradient(closest-side,#a9b0ff14,#c8b8ff0a 55%,#0000);pointer-events:none}
#ending .ko{position:relative;margin:0;font-size:clamp(25px,3.6vw,44px);letter-spacing:.05em;word-break:keep-all;color:#f2f4fd;
  background:linear-gradient(100deg,#f4f6ff 0%,#f4f6ff 34%,#dcd6ff 44%,#cfe6ff 50%,#ece4ff 56%,#f4f6ff 66%,#f4f6ff 100%) 0 0/260% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 7px #e4e6ff4d) drop-shadow(0 0 22px #b8b2ff33);animation:shimmer 11s ease-in-out infinite alternate}
#ending .en{position:relative;margin:12px 0 22px;color:#c3cbee;font-size:clamp(14px,1.5vw,18px);letter-spacing:.04em;filter:drop-shadow(0 0 8px #b8c0ff33)}
#ending button{position:relative;pointer-events:none;color:#eef1fb;background:#d6dcff12;border-color:#d9dfff42;box-shadow:0 0 18px #aab2ff1f}
#ending.on button{pointer-events:auto}
#ending button:hover{border-color:#e6eaff99;background:#d6dcff1f}
@media (max-width:600px){#ending .ko{font-size:5.3vw;letter-spacing:.02em}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){#title,#hint,#ending{transition:none}#ending .ko{animation:none}}
</style>
<canvas id="stage" aria-label="비눗방울 막대와 빛의 정원"></canvas>
<button id="wandBtn" class="sr">비눗방울 막대 들기 또는 내려놓기</button>

<header id="title"><h1>AGAPE</h1><p>무조건적인 사랑</p><p id="lead">사랑을 불어 보내보세요.</p></header>
<p id="note">어떤 비눗방울은 흔적을 남기고, 어떤 비눗방울은 멀리 사라집니다.</p>
<p id="hint" role="status"></p>

<div id="actions">
  <button id="micBtn" hidden>마이크 켜기</button>
  <button id="holdBtn" hidden>길게 눌러 불기</button>
</div>

<button id="setBtn" aria-label="입력 설정" aria-expanded="false" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z M6 11a6 6 0 0 0 12 0 M12 17v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
<section id="settings" hidden>
  <label for="sens">마이크 감도</label>
  <input id="sens" type="range" min="0" max="100" value="50">
  <div id="meter" aria-hidden="true"><i id="level"></i><b id="gate"></b></div>
  <p id="micState"></p>
  <button id="noMic">마이크 없이 하기</button>
</section>

<section id="ending" hidden>
  <p class="ko">사랑을 주는 데 이유가 필요한가요?</p>
  <p class="en">Do I need a reason to give love?</p>
  <button id="againBtn">다시 하기</button>
</section>
<script>MODELS;window.AGAPE_NO_MIC=false;</script>
